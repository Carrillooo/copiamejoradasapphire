name: Construir app de macOS

# Compila Sapphire Personal en un runner macOS y publica el .app y el .dmg
# como artefactos descargables.
#
# Firma: ad-hoc (`-`). En Apple Silicon un binario SIN firma no arranca, así que
# ad-hoc es el mínimo viable sin cuenta de desarrollador. Implica que macOS
# pedirá los permisos (cámara, automatización…) de nuevo en cada versión, porque
# la firma cambia en cada compilación. Para uso diario, compila en local con tu
# propio Apple ID gratuito: ver DOCS-ES/INSTALAR.md.

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "MACOSX_DEPLOYMENT_TARGET (vacío = el del proyecto, 26.0)"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "DOCS-ES/**"
      - "previews/**"
      - "scripts-personal/IrisPreview/**"

permissions:
  contents: read

# Una compilación de macOS a la vez. Sin cancel-in-progress: la nueva espera a
# que termine la que esté en curso, en vez de tirar su progreso a la basura.
concurrency:
  group: construir-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    # El contexto `secrets` NO está disponible en los `if` de los pasos: usarlo
    # ahí impide que el workflow se interprete y la ejecución muere sin arrancar
    # ningún job. Se exponen aquí como env, que sí es un contexto válido en `if`.
    env:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_NAME }}
      AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
      AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Entorno disponible
        # Se imprime ANTES de compilar: si el SDK no llega al deployment target
        # del proyecto, esto es lo que lo explica.
        run: |
          sw_vers
          uname -m
          echo "--- Xcode disponibles ---"
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          echo "--- SDKs de macOS ---"
          xcodebuild -showsdks | grep -i macos || true

      - name: Restaurar binarios opcionales de upstream
        # No bloquea aquí: lo necesario para COMPILAR está en el repo, y este
        # paso también trae vídeos de demostración que no hacen falta.
        #
        # Pero el modelo de reconocimiento facial sí hace falta, y sin él la app
        # se instalaría con un Face ID que no puede funcionar. De eso se encarga
        # el paso «Meter el modelo facial en la app», que sí rompe el build.
        continue-on-error: true
        run: ./scripts-personal/restaurar-binarios.sh

      - name: Compilar (Release, firma ad-hoc)
        id: build
        run: |
          set -o pipefail
          EXTRA=""
          if [ -n "${{ inputs.deployment_target }}" ]; then
            EXTRA="MACOSX_DEPLOYMENT_TARGET=${{ inputs.deployment_target }}"
          fi
          xcodebuild \
            -project Sapphire.xcodeproj \
            -scheme Sapphire \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            SAPPHIRE_ENTITLEMENTS=Sapphire/Sapphire-adhoc.entitlements \
            WIDGETS_ENTITLEMENTS=Sapphire/Sapphire-adhoc.entitlements \
            ONLY_ACTIVE_ARCH=NO \
            $EXTRA \
            build 2>&1 | tee build.log

      - name: Meter el modelo facial en la app
        # Xcode no incluye `ArcFace.mlpackage` en el paquete, aunque esté en
        # disco dentro de la carpeta sincronizada. Y aunque lo incluyera, el
        # cargador de la huella facial hace `MLModel(contentsOf:)`, que sólo
        # abre modelos YA COMPILADOS: un .mlpackage hay que compilarlo antes.
        #
        # Así que se compila aquí, a `.mlmodelc`, y se mete en Resources. Eso
        # rompe la firma del paquete, de modo que se vuelve a firmar con las
        # MISMAS entitlements que usó el build: firmar sin ellas dejaría la app
        # sin permisos y no abriría.
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          PKG="Sapphire/Services/FaceID/Models/ArcFace.mlpackage"

          if [ -z "$APP" ]; then
            echo "No se encuentra la .app compilada." >&2
            exit 1
          fi
          if [ ! -d "$PKG" ]; then
            # El paso de restauración es `continue-on-error`: cuando falla se
            # marca en verde y su salida se pierde. Aquí el fallo SÍ se ve.
            #
            # Y se baja sólo el modelo, sin los vídeos de demostración que
            # aquel script trae de paso: son 54 MB que la compilación no usa,
            # y cada cosa que se descarga es una cosa más que puede fallar.
            echo "El modelo no está. Bajándolo de upstream, con la salida a la vista:"
            echo "--------------------------------------------------------------"
            TMP="$(mktemp -d)"
            trap 'rm -rf "$TMP"' EXIT
            git clone --filter=blob:none --sparse --depth 50 \
              https://github.com/cshariq/Sapphire.git "$TMP/up"
            git -C "$TMP/up" sparse-checkout set Sapphire/Services/FaceID/Models
            mkdir -p "$(dirname "$PKG")"
            cp -R "$TMP/up/$PKG" "$(dirname "$PKG")/"
            echo "--------------------------------------------------------------"
            du -sh "$PKG" || true
          fi

          if [ ! -d "$PKG" ]; then
            echo "Sigue sin estar $PKG. Arriba está el motivo." >&2
            exit 1
          fi

          if [ -d "$APP/Contents/Resources/ArcFace.mlmodelc" ]; then
            echo "El modelo ya estaba dentro; no hace falta tocar nada."
            exit 0
          fi

          echo "Compilando el modelo a .mlmodelc…"
          xcrun coremlcompiler compile "$PKG" "$APP/Contents/Resources"

          echo "Volviendo a firmar la app (añadir un recurso invalida el sello)…"
          codesign --force --sign - \
            --entitlements Sapphire/Sapphire-adhoc.entitlements \
            "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: Comprobar que el modelo facial va dentro de la app
        # El paso de restauración es `continue-on-error`, y Xcode incluye los
        # modelos por sincronización de carpeta: dos sitios por donde el modelo
        # puede desaparecer sin que la compilación falle. Cuando eso pasa, la
        # app se instala, el registro facial arranca, y NO TERMINA NUNCA, sin
        # decir por qué. Vale más romper aquí que entregar eso.
        run: |
          APP="$(find build/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "No se encuentra la .app compilada." >&2
            exit 1
          fi
          echo "App: $APP"
          echo "--- Modelos CoreML dentro del paquete ---"
          find "$APP/Contents/Resources" -maxdepth 1 \( -name '*.mlmodelc' -o -name '*.mlpackage' \) -print || true
          if find "$APP/Contents/Resources" -maxdepth 2 -name 'ArcFace*' | grep -q .; then
            echo "✓ El modelo ArcFace viaja dentro de la app."
          else
            echo "✗ La app NO lleva el modelo ArcFace: el registro facial no podría completarse." >&2
            echo "  Revisa el paso «Restaurar binarios opcionales de upstream»." >&2
            exit 1
          fi

      - name: Resumen de errores
        if: failure()
        run: |
          echo "=== errores del compilador ==="
          # Sólo diagnósticos reales: ruta:línea:columna: error.
          # Un `grep error:` a secas caza parámetros llamados `error`
          # (didFailToConnect:error:) y llena el resumen de ruido justo cuando
          # hay que leerlo rápido.
          grep -E "^[^ ]+:[0-9]+:[0-9]+: (error|fatal error):" build.log \
            | sed 's|.*/copiamejoradasapphire/||' | sort -u | head -40 || true
          echo
          echo "=== otros fallos (enlazado, recursos, firma) ==="
          grep -E "^(error|clang|ld|codesign|xcodebuild).*(error|failed)" build.log \
            | sort -u | head -20 || true
          grep -E "warning: .*deployment target" build.log | sort -u | head -5 || true

      - name: Importar certificado Developer ID
        # Opcional. Sólo se ejecuta si has añadido los secretos del repositorio.
        # Sin ellos, el .dmg sale con firma ad-hoc y Gatekeeper avisa.
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo -n "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Empaquetar .dmg
        run: ./scripts-personal/crear-dmg.sh build/Build/Products/Release/Iris.app

      - name: Subir .app
        uses: actions/upload-artifact@v4
        with:
          name: Iris-app
          path: build/Build/Products/Release/Iris.app
          if-no-files-found: error

      - name: Subir .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Iris-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Subir registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
