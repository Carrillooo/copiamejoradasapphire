name: Construir app de macOS

# Compila Sapphire Personal en un runner macOS y publica el .app y el .dmg
# como artefactos descargables.
#
# Firma: ad-hoc (`-`). En Apple Silicon un binario SIN firma no arranca, así que
# ad-hoc es el mínimo viable sin cuenta de desarrollador. Implica que macOS
# pedirá los permisos (cámara, automatización…) de nuevo en cada versión, porque
# la firma cambia en cada compilación. Para uso diario, compila en local con tu
# propio Apple ID gratuito: ver DOCS-ES/INSTALAR.md.

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "MACOSX_DEPLOYMENT_TARGET (vacío = el del proyecto, 26.0)"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "DOCS-ES/**"

permissions:
  contents: read

# Una compilación de macOS a la vez. Sin cancel-in-progress: la nueva espera a
# que termine la que esté en curso, en vez de tirar su progreso a la basura.
concurrency:
  group: construir-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    # El contexto `secrets` NO está disponible en los `if` de los pasos: usarlo
    # ahí impide que el workflow se interprete y la ejecución muere sin arrancar
    # ningún job. Se exponen aquí como env, que sí es un contexto válido en `if`.
    env:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_NAME }}
      AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
      AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Entorno disponible
        # Se imprime ANTES de compilar: si el SDK no llega al deployment target
        # del proyecto, esto es lo que lo explica.
        run: |
          sw_vers
          uname -m
          echo "--- Xcode disponibles ---"
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          echo "--- SDKs de macOS ---"
          xcodebuild -showsdks | grep -i macos || true

      - name: Restaurar binarios opcionales de upstream
        # No bloquea la compilación: lo necesario para compilar está en el repo.
        # Esto sólo añade el modelo de reconocimiento facial. Si falla, la app
        # se compila igual, sin reconocimiento facial.
        continue-on-error: true
        run: ./scripts-personal/restaurar-binarios.sh

      - name: Compilar (Release, firma ad-hoc)
        id: build
        run: |
          set -o pipefail
          EXTRA=""
          if [ -n "${{ inputs.deployment_target }}" ]; then
            EXTRA="MACOSX_DEPLOYMENT_TARGET=${{ inputs.deployment_target }}"
          fi
          xcodebuild \
            -project Sapphire.xcodeproj \
            -scheme Sapphire \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            CODE_SIGN_ENTITLEMENTS=Sapphire/Sapphire-adhoc.entitlements \
            ONLY_ACTIVE_ARCH=NO \
            $EXTRA \
            build 2>&1 | tee build.log

      - name: Resumen de errores
        if: failure()
        run: |
          echo "=== errores ==="
          grep -E "error:|warning: .*deployment target" build.log | sort -u | head -60 || true

      - name: Importar certificado Developer ID
        # Opcional. Sólo se ejecuta si has añadido los secretos del repositorio.
        # Sin ellos, el .dmg sale con firma ad-hoc y Gatekeeper avisa.
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo -n "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Empaquetar .dmg
        run: ./scripts-personal/crear-dmg.sh build/Build/Products/Release/Iris.app

      - name: Subir .app
        uses: actions/upload-artifact@v4
        with:
          name: Iris-app
          path: build/Build/Products/Release/Iris.app
          if-no-files-found: error

      - name: Subir .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Iris-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Subir registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
