name: Previsualizar componentes de Iris

# Renderiza los componentes del sistema de diseño a PNG con SwiftUI de verdad,
# en apariencia clara y oscura, y los deja en previews/ del repositorio.
#
# Compila sólo dos ficheros con swiftc, así que tarda segundos: no hace falta
# construir la aplicación entera para ver cómo queda un componente.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sapphire/Iris/**"
      - "scripts-personal/IrisPreview/**"
      - ".github/workflows/previsualizar-iris.yml"

permissions:
  contents: write

concurrency:
  group: previsualizar-iris
  cancel-in-progress: true

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Entorno
        run: swift --version

      - name: Compilar el banco de pruebas
        run: |
          set -o pipefail
          swiftc -O \
            scripts-personal/IrisPreview/main.swift \
            Sapphire/Iris/IrisDesignSystem.swift \
            -o irispreview 2>&1 | tee preview-build.log

      - name: Renderizar
        run: ./irispreview previews/

      - name: Publicar los PNG en el repositorio
        run: |
          if [ -z "$(git status --porcelain previews/)" ]; then
            echo "Sin cambios en las imágenes."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/
          git commit -m "Previsualización de los componentes de Iris [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Subir también como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-previews
          path: |
            previews/*.png
            preview-build.log
          if-no-files-found: warn
